name: Caller voice

# Generates the Russian caller pack with Yandex SpeechKit and pushes it to the "voice-ru" branch.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: 'Голос SpeechKit (ermil, filipp, zahar, madirus)'
        default: 'ermil'
      emotion:
        description: 'Эмоция (good, neutral, strict)'
        default: 'good'
      speed:
        description: 'Скорость (0.8–1.3)'
        default: '1.05'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate clips
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: node tools/gen-voice-yandex.mjs "${{ inputs.voice }}" "${{ inputs.emotion }}" "${{ inputs.speed }}"
      - name: Push to voice-ru branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B voice-ru
          git add audio/ru
          git commit -m "Russian caller voice: ${{ inputs.voice }} / ${{ inputs.emotion }}"
          git push -f origin voice-ru
